name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Version number without the v prefix, e.g. 2026.09.25.
          Append -N for same-day revisions (2026.09.25-2).
        required: true
        type: string
      title:
        description: Optional release title (defaults to tag name)
        required: false
        type: string

permissions:
  contents: write

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: "22"

jobs:
  discover:
    name: Discover sites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sites: ${{ steps.list.outputs.sites }}
    steps:
      - uses: actions/checkout@v7
      - name: List every site under sites/
        id: list
        run: |
          set -euo pipefail
          sites=$(node -e '
            const fs = require("node:fs");
            const found = fs
              .readdirSync("sites", { withFileTypes: true })
              .filter((d) => d.isDirectory() && fs.existsSync(`sites/${d.name}/package.json`))
              .map((d) => d.name)
              .sort();
            if (found.length === 0) {
              console.error("no site with a package.json under sites/ — gate would be vacuous");
              process.exit(1);
            }
            process.stdout.write(JSON.stringify(found));
          ')
          echo "sites=$sites" >> "$GITHUB_OUTPUT"
          echo "discovered sites: $sites"

  release:
    name: Release ${{ github.event.inputs.version }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate version format
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version }}"
          if ! echo "$version" | grep -qE '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(-[0-9]+)?$'; then
            echo "::error::Invalid version '$version'. Expected YYYY.MM.DD or YYYY.MM.DD-N"
            exit 1
          fi
          echo "VERSION=v$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build all sites to validate the snapshot
        run: |
          set -euo pipefail
          sites='${{ needs.discover.outputs.sites }}'
          for site in $(echo "$sites" | jq -r '.[]'); do
            echo "::group::Build $site"
            cd "sites/$site"
            pnpm install --frozen-lockfile
            pnpm run build 2>&1 | tail -10
            cd ../..
            echo "::endgroup::"
          done

      - name: Check tag does not exist
        run: |
          set -euo pipefail
          if git tag -l "$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists. Use a different version (append -2, -3, etc)."
            exit 1
          fi

      - name: Generate release body
        id: body
        run: |
          set -euo pipefail
          export VERSION="$TAG"
          export GITHUB_SHA="${{ github.sha }}"
          node scripts/generate-release-body.mjs > /tmp/release-body.md
          echo "body generated — $(wc -c < /tmp/release-body.md) bytes"

      - name: Create tag
        run: |
          set -euo pipefail
          git config user.name "virtengine-bot"
          git config user.email "bot@virtengine.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="${{ github.event.inputs.title }}"
          if [ -z "$title" ]; then
            title="$TAG"
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$title" \
            --notes-file /tmp/release-body.md