name: ci

# Build gate for the four production sites in sites/ and workers/blog-redirect.
# Before this workflow existed the repo had zero workflows: nothing built the sites,
# so a broken Astro build or a dead internal link could reach production unnoticed.
#
# Site list is discovered, not hardcoded, so a new site under sites/ is built too.
#
# Both integration branches are gated. `develop` is where every PR lands in the
# two-tier model, so a gate that only watched `main` left the branch that actually
# receives work unverified: #19 (the OrderDemo type fix) had to be proven green by a
# manual `workflow_dispatch`, and a regression merged to `develop` would first be
# reported by a `main` push, after the fact. Gating `develop` moves the report to
# the PR that introduced it.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.28.2
  NODE_VERSION: "22"

jobs:
  discover:
    name: discover sites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sites: ${{ steps.list.outputs.sites }}
    steps:
      - uses: actions/checkout@v7
      - name: List every site under sites/
        id: list
        run: |
          set -euo pipefail
          sites=$(node -e '
            const fs = require("node:fs");
            const found = fs
              .readdirSync("sites", { withFileTypes: true })
              .filter((d) => d.isDirectory() && fs.existsSync(`sites/${d.name}/package.json`))
              .map((d) => d.name)
              .sort();
            if (found.length === 0) {
              console.error("no site with a package.json under sites/ — gate would be vacuous");
              process.exit(1);
            }
            process.stdout.write(JSON.stringify(found));
          ')
          echo "sites=$sites" >> "$GITHUB_OUTPUT"
          echo "discovered sites: $sites"

  build:
    name: build ${{ matrix.site }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.discover.outputs.sites) }}
    defaults:
      run:
        working-directory: sites/${{ matrix.site }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: sites/${{ matrix.site }}/pnpm-lock.yaml

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Type check (astro check, ratcheted against scripts/types-baseline.json)
        run: |
          set -o pipefail
          pnpm run check:types 2>&1 | tee typecheck.log
          # scripts/check-types.mjs is a ratchet, the same shape as check-a11y.mjs: it fails when a
          # site exceeds its budget in scripts/types-baseline.json AND when the baseline is looser
          # than reality, so the budget can only move down. It hard-fails when astro check inspected
          # nothing, and prints TYPECHECK-OK only after a real run — assert the marker so a checker
          # that silently did nothing cannot look green.
          grep -q '^TYPECHECK-OK' typecheck.log

      - name: Build
        run: pnpm run build

      - name: Assert the build emitted HTML
        run: |
          set -euo pipefail
          count=$(find dist -type f -name '*.html' | wc -l)
          echo "html files built: $count"
          test "$count" -gt 0

      - name: Link check (internal)
        run: |
          set -o pipefail
          pnpm run check:links | tee linkcheck.log
          # Guard against a checker that silently checks nothing.
          grep -q '^LINKCHECK-OK' linkcheck.log

      - name: Accessibility budget
        run: |
          set -o pipefail
          pnpm run check:a11y | tee a11y.log
          # Guard against a checker that silently checks nothing.
          grep -q '^A11Y-OK' a11y.log

      - name: Performance budget
        run: |
          set -o pipefail
          pnpm run check:perf | tee perf.log
          # scripts/check-perf.mjs is a ratchet over scripts/perf-baseline.json, the same shape as
          # check-a11y.mjs: it fails when a site ships more gzipped bytes than budgeted AND when the
          # budget is looser than reality, so a budget can only be fixed by making the site lighter.
          # It hard-fails on a missing dist, a dist with no HTML, and a dist whose asset references
          # resolve to nothing, and prints PERF-OK only after a real run — so a checker that
          # silently measured nothing cannot look green.
          grep -q '^PERF-OK' perf.log

      - name: Structured data (JSON-LD) check
        run: |
          set -o pipefail
          pnpm run check:schema | tee schema.log
          # Guard against a checker that silently checks nothing: it hard-fails on an empty dist
          # or on a dist where no page carried JSON-LD, and only then prints the marker.
          grep -q '^STRUCTURED-OK' schema.log

      - name: SEO meta gate (titles and descriptions)
        run: |
          set -o pipefail
          pnpm run audit:seo | tee seo.log
          # Guard against a checker that silently checks nothing: it hard-fails on a dist with no
          # indexable page, and only then prints the marker.
          grep -q '^SEO-OK' seo.log

      - name: Markdown negotiation check
        run: |
          set -o pipefail
          # Sites without functions/_middleware.js (e.g. docs) skip gracefully.
          if [ -f functions/_middleware.js ]; then
            pnpm run check:markdown | tee markdown.log
            # Guard against a checker that silently checks nothing.
            grep -q '^MARKDOWN-OK' markdown.log
          else
            echo "no markdown middleware for this site - skipping"
          fi

  selftest:
    name: checkers self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Prove the checkers can fail
        run: |
          set -euo pipefail
          node --test --test-reporter=tap scripts/*.test.mjs | tee selftest.log
          # A glob that matches no file exits 0 having run nothing — require a real run.
          grep -qE '^# tests [1-9][0-9]*' selftest.log
          grep -qE '^# fail 0' selftest.log

  bypass:
    name: branch bypass guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the guard compares refs, and a shallow clone has no merge-base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Only meaningful once both branches exist on the remote. The very first run of a
      # brand-new repo has one of them missing, and that is not a bypass.
      - name: Fetch both integration branches
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/develop:refs/remotes/origin/develop" || true
          for ref in origin/main origin/develop; do
            git rev-parse --verify --quiet "${ref}^{commit}" >/dev/null \
              && echo "resolved ${ref}" \
              || echo "::notice::${ref} does not exist yet on this remote — guard compares nothing"
          done

      - name: No commit reached main without passing develop
        run: |
          set -o pipefail
          node scripts/check-branch-bypass.mjs | tee bypass.log
          # Guard against a guard that silently skipped itself.
          grep -qE '^BYPASS-(OK|FAIL|SKIPPED)' bypass.log

  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Syntax, config and build-script checks
        run: node scripts/check-static.mjs

      - name: Design guardrail (DESIGN-DIRECTION §7)
        run: |
          set -o pipefail
          node scripts/check-design.mjs | tee design.log
          # Guard against a checker that silently checks nothing.
          grep -q '^check-design: OK' design.log

  worker:
    name: worker blog-redirect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/blog-redirect
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Syntax check
        run: node --check src/index.mjs
      - name: Unit tests
        run: node --test

  ci:
    name: ci
    if: always()
    needs: [discover, build, selftest, static, bypass, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate must have succeeded
        run: |
          set -euo pipefail
          for result in \
            "discover=${{ needs.discover.result }}" \
            "build=${{ needs.build.result }}" \
            "selftest=${{ needs.selftest.result }}" \
            "static=${{ needs.static.result }}" \
            "bypass=${{ needs.bypass.result }}" \
            "worker=${{ needs.worker.result }}"
          do
            echo "$result"
            case "$result" in
              *"=success") ;;
              *) echo "::error::required job $result"; exit 1 ;;
            esac
          done
